name: CI
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (file mode, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: byte-compile all repo .py (catches syntax errors in un-imported files)
        run: python -m compileall -q -x '(^|/)(\.git|data|\.?venv[^/]*|env|node_modules|__pycache__)(/|$)' .
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - name: lineage diff on test failure
        if: failure()
        run: |
          python lineage/build_lineage.py
          git diff -- lineage/lineage.json
      - name: forecast smoke run
        run: python -m forecast.train --out /tmp

  compose-smoke:
    name: docker compose integration (MySQL + Redis + API)
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - name: start stack
        env:
          AUTH_DEMO_ENABLED: "1"
          REDIS_URL: redis://redis:6379/0
          COMPOSE_PROFILES: cache
        run: |
          [ -f .env ] || cp .env.example .env
          bash scripts/start.sh
      - name: probe endpoints
        run: |
          B=http://localhost:5000
          for i in $(seq 1 30); do curl -fs $B/api/health && break; sleep 2; done
          J() { curl -fs "$B$1" | python3 -c "import sys,json;d=json.load(sys.stdin);print($2)"; }
          # parse JSON instead of grepping (health is pretty-printed since fd27af1)
          test "$(J /api/health 'd["ok"]')" = True
          # compose defaults API_SOURCE=mysql; fresh empty DB gets demo seed via start.sh -> must be real mysql, no silent fallback
          test "$(J /api/health 'd["data"]["source"]')" = mysql
          test "$(J /api/health 'd["data"]["fallback"]')" = False
          test "$(J '/api/overview?dt=2022-09-01' 'd["data"]["station_cnt"]')" = 25
          test "$(J /api/zones 'len(d["data"])')" = 18
          test "$(J '/api/zone/series?taz_id=1106' 'len(d["data"]["points"])')" = 168
          curl -fs $B/ | grep -q '<title>'
          # 写链路：演示管理员仅在 CI 私有环境启用；创建后再修改工单状态。
          TICKET_JSON=$(curl -fsS -X POST "$B/api/tickets" -H 'Content-Type: application/json' -H 'Authorization: Bearer demo-admin' -d '{"station_id":"1554","type":"repair"}')
          TICKET_ID=$(printf '%s' "$TICKET_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["ticket"]["ticket_id"])')
          test -n "$TICKET_ID"
          PATCH_JSON=$(curl -fsS -X PATCH "$B/api/tickets/$TICKET_ID" -H 'Content-Type: application/json' -H 'Authorization: Bearer demo-admin' -d '{"status":"processing"}')
          test "$(printf '%s' "$PATCH_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["status"])')" = processing
          # Redis：清空专用 CI 缓存后，第一次 MISS、第二次 HIT。
          docker exec sz-ev-redis redis-cli FLUSHDB
          curl -fsS -D /tmp/z1.headers -o /tmp/z1.json "$B/api/zones?cache_probe=ci"
          curl -fsS -D /tmp/z2.headers -o /tmp/z2.json "$B/api/zones?cache_probe=ci"
          grep -qi '^X-Cache: MISS' /tmp/z1.headers
          grep -qi '^X-Cache: HIT' /tmp/z2.headers
      - name: logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: stop
        if: always()
        run: bash scripts/stop.sh --purge || true

  ui-pages:
    name: page checks (playwright, file mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: start api (file mode) and web
        run: |
          (cd api && API_SOURCE=file nohup python -c "import app; app.app.run(host='127.0.0.1', port=5000)" > /tmp/api.log 2>&1 &)
          (cd web && nohup python -m http.server 5096 --bind 127.0.0.1 > /tmp/web.log 2>&1 &)
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:5000/api/health >/dev/null && curl -fs http://127.0.0.1:5096/index.html >/dev/null && break; sleep 1; done
      - name: open every page, check JS errors / failed API calls / banned words
        env:
          UI_TESTS: "1"
        run: python -m pytest -q tests/ui
      - name: api log on failure
        if: failure()
        run: tail -100 /tmp/api.log
