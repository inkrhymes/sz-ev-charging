services:
  mysql:
    image: mysql:8.0
    container_name: sz-ev-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sz_ev}
      MYSQL_USER: ${MYSQL_USER:-ev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-evpass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      # 绑定挂载到宿主目录（已 gitignore），box 重启/重装 docker 后数据仍在
      - ${MYSQL_DATA_DIR:-./data/mysql}:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    container_name: sz-ev-api
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-ev}:${MYSQL_PASSWORD:-evpass}@mysql:3306/${MYSQL_DATABASE:-sz_ev}
      FLASK_ENV: development
      REPO_ROOT: /repo
      MOCK: "0"
      # 整个 API（含地图/告警/工单）读库；改成 file 则全部读本机文件
      API_SOURCE: ${API_SOURCE:-mysql}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-ev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-evpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sz_ev}
      # 可选 Redis 读缓存：留空 = 不启用（默认）；开启见下面 redis 服务和 docs/perf/api_loadtest.md
      REDIS_URL: ${REDIS_URL:-}
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - ./:/repo:ro
      - ./api:/app
      - ./web:/app/static_web:ro
      - ./stubs:/app/stubs:ro
    depends_on:
      mysql:
        condition: service_healthy

  # 可选：API 读缓存。默认不启动，需要时：
  #   REDIS_URL=redis://redis:6379/0 docker compose --profile cache up -d redis api
  redis:
    image: redis:7-alpine
    container_name: sz-ev-redis
    profiles: ["cache"]
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  # 单节点 Kafka（KRaft，无 ZooKeeper），只在 --profile stream 时启动
  kafka:
    image: apache/kafka:3.7.0
    container_name: sz-ev-kafka
    profiles: ["stream"]
    mem_limit: 512m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # 一次性建 topic：charge_5min，6 分区，1 副本
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: sz-ev-kafka-init
    profiles: ["stream"]
    mem_limit: 256m
    network_mode: "service:kafka"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: "-Xmx128m"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092
        --create --if-not-exists --topic charge_5min
        --partitions 6 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --describe --topic charge_5min
    restart: "no"
