services:
  mysql:
    image: mysql:8.0
    container_name: sz-ev-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sz_ev}
      MYSQL_USER: ${MYSQL_USER:-ev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-evpass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      # 绑定挂载到宿主目录（已 gitignore），box 重启/重装 docker 后数据仍在
      - ${MYSQL_DATA_DIR:-./data/mysql}:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    container_name: sz-ev-api
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-ev}:${MYSQL_PASSWORD:-evpass}@mysql:3306/${MYSQL_DATABASE:-sz_ev}
      FLASK_ENV: development
      REPO_ROOT: /repo
      MOCK: "0"
      # 整个 API（含地图/告警/工单）读库；改成 file 则全部读本机文件
      API_SOURCE: ${API_SOURCE:-mysql}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-ev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-evpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sz_ev}
      # 可选 Redis 读缓存：留空 = 不启用（默认）；开启见下面 redis 服务和 docs/perf/api_loadtest.md
      REDIS_URL: ${REDIS_URL:-}
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - ./:/repo:ro
      - ./api:/app
      - ./web:/app/static_web:ro
      - ./stubs:/app/stubs:ro
    depends_on:
      mysql:
        condition: service_healthy

  # 可选：API 读缓存。默认不启动，需要时：
  #   REDIS_URL=redis://redis:6379/0 docker compose --profile cache up -d redis api
  redis:
    image: redis:7-alpine
    container_name: sz-ev-redis
    profiles: ["cache"]
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
