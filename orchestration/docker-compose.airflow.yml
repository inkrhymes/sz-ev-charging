# 单容器 Airflow（LocalExecutor），元数据库放在现有 sz-ev-mysql 的 airflow 库。
# 启动: docker compose -f orchestration/docker-compose.airflow.yml up -d
# 停止: docker compose -f orchestration/docker-compose.airflow.yml down
services:
  airflow:
    image: apache/airflow:2.9.3-python3.11
    container_name: sz-ev-airflow
    network_mode: host          # 直接连宿主 3306 上的 MySQL
    mem_limit: 1536m
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+mysqldb://root:${MYSQL_ROOT_PASSWORD:-rootpass}@127.0.0.1:3306/airflow
      AIRFLOW__WEBSERVER__WORKERS: "1"
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8080"
      AIRFLOW__CORE__DAGS_FOLDER: /repo/orchestration/dags
      REPO_ROOT: /repo
      MYSQL_HOST: 127.0.0.1
      _PIP_ADDITIONAL_REQUIREMENTS: "pymysql"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _AIRFLOW_DB_MIGRATE: "true"
    user: "50000:0"
    volumes:
      - ../:/repo
    command: standalone
