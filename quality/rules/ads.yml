rules:
  - {name: ads_row_count_min, type: row_count_min, min: 24, severity: block}
  - {name: ads_pk_unique, type: duplicate_key, keys: [taz_id, ts_hour], severity: block}
  - {name: ads_occupancy_range, type: range, column: occupancy_avg, min: 0, max: 1, severity: block}
  - {name: ads_station_cnt_positive, type: range, column: station_cnt, min: 1, severity: block}
  - {name: ads_occupancy_not_null, type: not_null_rate, columns: [occupancy_avg], min: 0.5, severity: warn}
