# ods 层：每日原始 5 分钟数据（一个 dt 分区）
# severity: block = 失败阻断下游；warn = 只记录
rules:
  - {name: ods_row_count_min, type: row_count_min, min: 1, severity: block, phrase: "{date}原始数据一条都没有（只有 {actual} 条）"}
  - {name: ods_row_count_vs_prev_day, type: row_count_delta, max_ratio: 0.5, severity: block, phrase: "{date}原始数据量和前一天相比变化太大（变了 {actual}，超过 {threshold} 就提醒）"}
  - {name: ods_pk_unique, type: duplicate_key, keys: [station_id, ts], severity: block, phrase: "{date}原始数据里有 {actual} 条重复记录（同一个站同一时刻出现多次）"}
  - {name: ods_freshness, type: freshness, column: ts, min_end_offset: 23h, severity: block, phrase: "{date}原始数据没有覆盖到当天晚上，数据可能还没传完"}
  - {name: ods_busy_non_negative, type: range, column: busy, min: 0, severity: block, phrase: "{date}有 {actual} 条记录的“在充电桩数”是负数，数据有误"}
  # 真实数据特征：演示集整体缺数比例约 26.42%，只告警
  - {name: ods_row_not_null_rate, type: not_null_rate, columns: [busy, idle], mode: any, min: 0.80, severity: warn, phrase: "{date}原始数据里有数的记录只占 {actual_pct}（低于 {threshold_pct} 就提醒）"}